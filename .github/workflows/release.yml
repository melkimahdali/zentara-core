name: Release

# Saat sebuah GitHub Release diterbitkan (tag v<versi>), workflow ini menguji semuanya lalu
# MENITIPKAN (stage) versi baru di npm lewat Trusted Publishing (OIDC, tanpa token tersimpan).
# Versi baru baru tayang setelah pemilik paket menyetujuinya dengan 2FA:
#   npm stage list zentara  ->  npm stage approve <stage-id>
# Lihat PUBLISHING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Pastikan npm mendukung trusted publishing & staged publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e

      - name: Cocokkan tag rilis dengan versi paket
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in zentara create-zentara; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$v" != "$TAG" ]; then
              echo "::error::Tag $TAG tidak cocok dengan versi $pkg ($v). Jalankan: node scripts/version.mjs <versi>"
              exit 1
            fi
          done

      - name: Titipkan (stage) ke npm, menunggu persetujuan pemilik
        env:
          # npm hanya bisa membuat provenance untuk repo publik; repo private tetap bisa rilis tanpa provenance.
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: |
          for pkg in zentara create-zentara; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$pkg@$v" version >/dev/null 2>&1; then
              echo "$pkg@$v sudah tayang di npm, dilewati"
              continue
            fi
            # npm stage tidak mengenal workspace: jalankan dari folder paketnya.
            (cd "packages/$pkg" && npm stage publish --access public $PROVENANCE)
            echo "::notice::$pkg@$v dititipkan. Setujui dengan: npm stage list $pkg lalu npm stage approve <stage-id>"
          done
