name: Docs

# Terbitkan situs dokumentasi (docs/*.md + catatan rilis dari CHANGELOG.md) ke GitHub Pages di
# https://zentara-core.morixa.id (domain kustom lewat Cloudflare; file CNAME ikut dibuat oleh docs:build).
# Diterbitkan ulang setiap ada perubahan di main, jadi versi, catatan rilis, dan dokumentasi selalu
# mengikuti versi terbaru.
# Sekali saja: Settings → Pages → Source: "GitHub Actions", Custom domain: zentara-core.morixa.id.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
