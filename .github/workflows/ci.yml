name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test build produksi
        run: |
          PORT=3000 node dist/main.js &
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/hello && break; sleep 0.5; done
          curl -fsS http://localhost:3000/ | grep -q "Zentara Core"
          curl -fsS http://localhost:3000/api/users/1 | grep -q '"id":1'
