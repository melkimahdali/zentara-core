name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zentara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZENTARA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/zentara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test build produksi
        run: |
          node dist/cli.js db:migrate
          node dist/cli.js db:seed
          PORT=3000 node dist/main.js &
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/hello && break; sleep 0.5; done
          curl -fsS http://localhost:3000/ | grep -q "Zentara Core"
          curl -fsS http://localhost:3000/api/products | grep -q "Kopi Gayo"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me)" = "401"
